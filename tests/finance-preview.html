<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/10.12.5/; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.karamanozelidare.gov.tr; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com https://www.karamanozelidare.gov.tr; frame-src 'self' blob: https://dtmd-b927d.firebaseapp.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
  <title>DTM hesaplama kontrolü</title>
  <link rel="stylesheet" href="../app/css/style.css">
  <style>
    body { padding:24px; background:#f1f5f9; }
    .controls { display:flex; gap:16px; flex-wrap:wrap; align-items:end; background:white; padding:18px; margin-bottom:16px; border-radius:8px; }
    label { display:flex; flex-direction:column; gap:4px; }
    #result { max-width:1050px; padding:20px; background:white; margin-top:16px; }
  </style>
</head>
<body>
  <h1>DTM hesaplama kontrolü</h1>
  <p>Örnek proje: 200.000 TL sözleşme bedeli, 500 TL sözleşme damga vergisi. Bu sayfa Firebase'e bağlanmaz.</p>
  <div class="controls">
    <label>KDV (%)<select id="testKdv" data-dtm-onchange="qa-0"><option value="0">0</option><option value="20" selected>20</option></select></label>
    <label>Önceki hakediş (TL)<input id="testOnceki" type="number" value="0" data-dtm-oninput="qa-1"></label>
    <label>SGK kesintisi (TL)<input id="testSgk" type="number" value="0" data-dtm-oninput="qa-2"></label>
    <button data-dtm-onclick="qa-3">Hakediş önizlemesi</button>
    <button data-dtm-onclick="qa-4">Proje özeti</button>
    <button data-dtm-onclick="qa-5">Gerçek veri giriş formu</button>
    <button data-dtm-onclick="qa-6">Yaklaşık maliyet</button>
    <button data-dtm-onclick="qa-7">Teklif tutanağı</button>
  </div>
  <div class="controls">
    <button data-dtm-onclick="qa-8">PDF indir</button>
    <button data-dtm-onclick="qa-9">Word hakediş indir</button>
    <button data-dtm-onclick="qa-10">Excel yaklaşık maliyet indir</button>
    <button data-dtm-onclick="qa-11">Excel teklif indir</button>
  </div>
  <button data-dtm-onclick="qa-csp">CSP engellemesini test et</button>
  <button data-dtm-onclick="qa-read-pdf">Metin PDF okuyucusunu test et</button>
  <p id="cspResult"></p>
  <p id="testState"></p>
  <div id="result"><div id="mainContent"></div></div>
  <input id="loginPassword" hidden><input id="loginUsername" hidden>
  <script src="../app/js/html2pdf.bundle.min.js?v=20261003-security"></script>
  <script src="../app/js/data.js?v=20261003-security"></script>
  <script src="../app/js/utils.js?v=20261003-security"></script>
  <script src="../app/js/calculations.js?v=20261003-security"></script>
  <script src="../app/js/documents.js?v=20261003-security"></script>
  <script src="../app/js/excel.js?v=20261003-security"></script>
  <script src="../app/js/word.js?v=20261003-security"></script>
  <script src="finance-setup.js?v=20261003-security"></script>
  <script src="../app/js/app.js?v=20261003-security"></script>
  <script src="../app/js/bootstrap.js?v=20261003-security"></script>
  <script src="finance-preview.js?v=20261003-security"></script>
</body>
</html>
